name: Actualizar cartelera y publicar
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: cinepunta-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Consultar fuentes oficiales
        id: update
        continue-on-error: true
        run: npm run update
      - name: Guardar cartelera y afiches
        run: |
          git config user.name "CinePunta Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/listings.json docs/data/reviews.json docs/posters
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar cartelera desde fuentes oficiales"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publicar GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Reportar fallo de fuentes
        if: steps.update.outcome == 'failure'
        run: exit 1
